[Compilers]
; Each shipped compiler is defined by a [Compiler <name>] section in
; EdSharp.inix, one named key per setting, values kept verbatim. The
; values below are short descriptions; the names are what the Pick
; Compiler command lists. Retired from the shipped table on 24 August
; 2026 as no longer realistically relevant: Boo, Java, LaTeX, MinGW
; C++, Perl, PHP, PowerBASIC, Ruby, and Visual Basic .NET. Any of them
; can come back as a private [Compiler <name>] section in EdSharp.inix,
; or as an old-style tilde-packed value here, which still works for
; entries that have no section.
Default="No compiler; plain editing"
C#="The .NET Framework C# compiler"
Python="The latest official Python for Windows"
JavaScript="JavaScript run by Node.js"
PowerShell="Windows PowerShell scripts"
JAWS Script="The JAWS script compiler"
VBScript="Windows Script Host VBScript"
JScript .NET="The JScript .NET compiler that builds EdSharp.dll"
HTML Tidy="Checking web pages with HTML Tidy"

